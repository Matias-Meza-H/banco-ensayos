<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma de Calidad · APAS Chile</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#17202b;--muted:#5e6a79;--line:#e1e6ec;--accent:#173f66;--accent2:#2f6fa8;--soft:#e8f0f8;
--ok:#1e7d4f;--ok-bg:#e3f4ea;--warn:#8a6d00;--warn-bg:#fbf3d4;--bad:#b42318;--bad-bg:#fde4e2;--na:#7a8594;--na-bg:#eef0f3;--faa:#1f5fa0;--faa-bg:#e3eefb;--dgac:#8a3b12;--dgac-bg:#fbeadf;--dual:#5b2a86;--dual-bg:#efe6f8}
@media (prefers-color-scheme: dark){:root{--bg:#11151b;--card:#1a2029;--ink:#e6eaf0;--muted:#9aa5b4;--line:#2b333f;--accent:#8fbbe6;--accent2:#6aa3db;--soft:#1e2b3b;
--ok:#5fd29a;--ok-bg:#163527;--warn:#e8c94f;--warn-bg:#3a3214;--bad:#ff8a80;--bad-bg:#3f1c1a;--na:#8d97a5;--na-bg:#252c36;--faa:#8fc0f5;--faa-bg:#1b2c40;--dgac:#f3a77b;--dgac-bg:#3a2316;--dual:#c9a2ef;--dual-bg:#2d2140}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#173f66;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;font-weight:650}
header p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.role{margin-left:auto;font-size:12px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:999px}
nav.views{background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:4px}
nav.views a{padding:11px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
nav.views a.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:18px 20px 40px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.kpi:hover{border-color:var(--accent2)} .kpi.on{outline:2px solid var(--accent2)}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)} .kpi small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
.tab{font:inherit;font-weight:600;font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.tab.on{color:#0e1a26}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select,.fld input,.fld select,.fld textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.toolbar input[type=search]{flex:1;min-width:240px}
.count{color:var(--muted);font-size:12.5px;margin-left:auto}
.wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--soft)}
td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:nowrap}
.b{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;margin:0 3px 2px 0;white-space:nowrap}
.b-FAA{background:var(--faa-bg);color:var(--faa)} .b-DGAC{background:var(--dgac-bg);color:var(--dgac)} .b-DUAL{background:var(--dual-bg);color:var(--dual)}
.b-x{background:var(--soft);color:var(--accent)}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-warn{background:var(--warn-bg);color:var(--warn)} .s-bad{background:var(--bad-bg);color:var(--bad)} .s-na{background:var(--na-bg);color:var(--na)} .s-info{background:var(--soft);color:var(--accent)}
.bar{height:8px;background:var(--na-bg);border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent2);border-radius:99px}
.pct{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:12.5px}
.more{display:block;margin:10px auto 0;font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.ccard:hover{border-color:var(--accent2)} .ccard h3{margin:0 0 4px;font-size:15px}
.empty{color:var(--muted);font-style:italic;padding:14px}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;justify-content:flex-end;z-index:20}
.overlay.open{display:flex}
.panel{width:min(820px,100%);height:100%;overflow-y:auto;background:var(--bg)}
.phead{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;gap:12px;align-items:flex-start}
.phead h2{margin:0;font-size:20px} .phead .sub{color:var(--muted);font-size:13px;margin-top:3px}
.x{margin-left:auto;font:inherit;font-size:20px;line-height:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none}
.pbody{padding:14px 20px 30px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.box h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px}
.f span{display:block;font-size:11.5px;color:var(--muted)} .f b{font-weight:560;white-space:pre-line}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.gallery figure{margin:0;position:relative} .gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--na-bg)}
.gallery .rm{position:absolute;top:4px;right:4px;border:none;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:12px;padding:2px 6px}
.dims{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){.btn.pri{color:#0e1a26}}
.btn.sm{font-size:12px;padding:4px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{background:var(--soft);color:var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
/* expedientes */
.exp{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media (max-width:900px){.exp{grid-template-columns:1fr}}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:10px;max-height:calc(100vh - 20px);display:flex;flex-direction:column}
.side input,.side select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;margin-bottom:6px}
.plist{overflow-y:auto}
.pi{padding:8px;border-radius:8px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.pi:hover{background:var(--soft)} .pi.on{background:var(--accent);color:#fff} .pi small{color:var(--muted)} .pi.on small{color:#d6e4f2}
.items td{font-size:13px}
.items select{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.ev{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12.5px;flex-wrap:wrap}
.ev img{width:42px;height:32px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.ev a{color:var(--accent2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.log{font-size:11.5px;color:var(--muted);margin-top:3px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.fld textarea{min-height:60px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.bub{border-radius:50%;border:2px solid var(--c);background:var(--cb);color:var(--c);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;padding:6px;text-align:center;transition:transform .12s}
.bub:hover{transform:scale(1.05)} .bub.on{background:var(--c);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (prefers-color-scheme: dark){.bub.on{color:#11151b}}
.bub b{line-height:1.1;font-variant-numeric:tabular-nums} .bub span{font-size:11.5px;font-weight:600;line-height:1.15}
.pn{font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;padding:2px 6px;margin:0 4px 4px 0;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
.pn:hover{border-color:var(--accent2)} .pn.dual{border-color:var(--dual);color:var(--dual)} .pn.more2{font-family:inherit;color:var(--accent2)}
.hero{background:linear-gradient(135deg,#173f66,#2f6fa8);color:#fff;border-radius:16px;padding:26px 28px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;margin-bottom:14px}
.hero-t{flex:1 1 320px}.hero h2{margin:4px 0 6px;font-size:26px}.hero p{margin:0;opacity:.85;font-size:13px}.eyebrow{font-size:12px;letter-spacing:.8px;text-transform:uppercase;opacity:.8}
.hero-n{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:14px;flex:2 1 520px}
.hero-n div{background:rgba(255,255,255,.12);border-radius:12px;padding:12px 14px}.hero-n b{display:block;font-size:30px;font-variant-numeric:tabular-nums}.hero-n span{font-size:12px;opacity:.9}
@media (max-width:760px){.hero-n{grid-template-columns:repeat(2,1fr)}}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}@media (max-width:900px){.cols{grid-template-columns:1fr}}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:4px 0 8px}.stack i{display:block}
.legend2{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px}.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.auths{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.auth{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:3px}.auth small{color:var(--muted);font-size:11.5px}.auth.dim{opacity:.75;border-style:dashed}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:80px 1fr;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl time{color:var(--muted);font-size:12px;grid-row:span 2}.tl span{font-size:12px;color:var(--muted)}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;color:var(--accent2)}
.fcard:hover{border-color:var(--accent2)}.fcard b{color:var(--ink);display:block}.fcard small{display:block;color:var(--muted);font-size:12px}
.note2{font-size:12px;color:var(--muted);margin:10px 0}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--c);background:var(--cb);color:var(--c);border-radius:999px;padding:5px 12px;cursor:pointer}.chip.on{background:var(--c);color:#fff}
.xmk{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);opacity:.7;border-radius:1px}
tr.grp td{background:var(--soft);font-weight:700;font-size:12.5px;color:var(--accent)} tr.grp span{font-weight:500;color:var(--muted);margin-left:8px}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 8px}
.cond{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin:4px 0 8px}
.warn{font-size:11.5px;color:var(--bad);margin-top:4px;line-height:1.4}
.warnbox{margin-top:12px;background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:12.5px;line-height:1.5}
.evform{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;padding:6px;border:1px dashed var(--line);border-radius:8px}
.evform select,.evform input{font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;flex:none}
.lnk{border:none;background:none;color:var(--accent2);font:inherit;font-size:11.5px;cursor:pointer;padding:2px 0;margin-right:8px}
.hist{font-size:11.5px;color:var(--muted);border-left:2px solid var(--line);padding:4px 8px;margin:4px 0;line-height:1.5}
.roles{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--ink);font-size:13px}
.cgrid{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}@media (max-width:900px){.cgrid{grid-template-columns:1fr}}
.cbanner{display:flex;gap:16px;align-items:center}.kit svg{width:110px;height:auto}
.citem{border-top:1px solid var(--line);padding:10px 0}.citem:first-of-type{border-top:none}
.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.collab{margin-top:10px;border:1px dashed var(--accent2);border-radius:8px;padding:8px 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-right:10px;background:var(--card)}
.seg button{font:inherit;font-weight:600;font-size:13.5px;border:none;background:none;padding:8px 16px;cursor:pointer;color:var(--muted)}.seg button.on{background:var(--accent);color:#fff}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}.acard:hover{border-color:var(--accent2)}
.acard .ah{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.acard .ah b{margin-right:auto}.acard small{color:var(--muted);display:block;margin:4px 0}
.acard .ax{font-size:12px;color:var(--muted);line-height:1.4}
.verb{margin-top:10px;border:1px solid var(--line);border-left:3px solid var(--dgac);border-radius:8px;padding:10px 12px;background:var(--bg)}
.verb .vh{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}.verb .vm{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.verb .vt{white-space:pre-line;font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.5}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.choose .btn{white-space:normal;text-align:left;padding:14px;display:flex;flex-direction:column;gap:6px}
.choose small{color:var(--muted);font-size:12px;line-height:1.4}
footer{max-width:1280px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12px}
#viewer{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
#viewer .vbox{background:var(--card,#fff);border-radius:12px;width:min(1040px,100%);height:min(92vh,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#viewer .vbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line,#e5e7eb)}
#viewer .vbar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .vbody{flex:1;overflow:auto;padding:12px;background:#eef1f5}
#viewer .vpage{display:block;margin:0 auto 12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);max-width:100%}
.ynr{display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-size:12.5px;cursor:pointer}
.seref{width:100%;font:inherit;font-size:12.5px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
#faaBox details{margin:8px 0;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
#faaBox summary{cursor:pointer}
.hlogo{height:40px;background:#fff;border-radius:8px;padding:4px 8px}
.role{margin-left:0}
nav.mods{background:#102f4d;padding:0 20px;display:flex;gap:2px}
nav.mods a{padding:9px 16px;color:#c9d8e8;text-decoration:none;font-weight:600;font-size:13.5px;border-radius:8px 8px 0 0}
nav.mods a.on{background:var(--card);color:var(--accent)}
[hidden]{display:none!important}
body.locked > :not(#login){display:none!important}
#login{position:fixed;inset:0;z-index:1000;background:linear-gradient(160deg,#0f2c49,#1d5587);display:flex;align-items:center;justify-content:center;padding:20px}
#login[hidden]{display:none}
.lbox{background:#fff;color:#17202b;border-radius:16px;padding:28px 30px;width:min(380px,100%);box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}
.lbox h2{margin:14px 0 2px;font-size:19px}.lsub{color:#5e6a79;font-size:13px;margin-bottom:16px}
.lbox label{display:block;text-align:left;font-size:12px;color:#5e6a79;margin-bottom:10px}
.lbox input{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:9px 10px;border:1px solid #cfd6de;border-radius:8px;margin-top:3px;background:#fff;color:#17202b}
.lerr{color:#b42318;font-size:12.5px;min-height:18px;margin-bottom:6px}.lfoot{color:#7a8594;font-size:11px;margin-top:14px;line-height:1.5}
.astrip{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12.5px;display:flex;flex-direction:column}
.ach.nac{border-color:var(--accent2)}.ach small{color:var(--muted)}
.aprbox{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.aebox{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
</style>
</head>
<body>
<div id="login" hidden></div>
<header>
  <img class="hlogo" src="__LOGO__" alt="APAS Chile">
  <div><h1>Plataforma de Calidad · APAS Chile</h1><p>DGAC CMA #655 · FAA CRS #APAY048E</p></div>
  <span id="userBox" style="margin-left:auto;display:flex;gap:8px;align-items:center"></span>
</header>
<nav class="mods"><a href="#inicio" data-m="cap">Capacidades</a><a href="#fichas" data-m="pers">Personal y capacitación</a><a href="#sistema" data-m="sys">Sistema</a><a href="/herramientas/" data-m="ext">Control de Herramientas ↗</a></nav>

<main id="v-carga" hidden></main>
<main id="v-informes" hidden></main>

<main id="v-expedientes" hidden>
