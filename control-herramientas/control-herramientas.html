<title>Control de Herramientas · APAS Chile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: banda de marca + navegación por pestañas, contenido a 1320px; misma familia visual que la Plataforma de Calidad */
:root{--bg:#f4f6f9;--card:#fff;--ink:#17202b;--muted:#5e6a79;--line:#e1e6ec;--accent:#173f66;--accent2:#2f6fa8;--soft:#e8f0f8;--brand:#173f66;--brand2:#102f4d;--onbrand:#fff;
--ok:#1e7d4f;--ok-bg:#e3f4ea;--warn:#8a6d00;--warn-bg:#fbf3d4;--soon:#a5480b;--soon-bg:#fde8d6;--bad:#b42318;--bad-bg:#fde4e2;--na:#7a8594;--na-bg:#eef0f3;
--hl:#fff1a8;--hl-ink:#6b5300;--int:#2f6fa8;--ext:#7a4bb0;--none:#9aa5b4;--shadow:0 20px 60px rgba(10,20,35,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151b;--card:#1a2029;--ink:#e6eaf0;--muted:#9aa5b4;--line:#2b333f;--accent:#8fbbe6;--accent2:#6aa3db;--soft:#1e2b3b;--brand:#14304d;--brand2:#0d2238;--onbrand:#eef4fa;
--ok:#5fd29a;--ok-bg:#163527;--warn:#e8c94f;--warn-bg:#3a3214;--soon:#f5a36a;--soon-bg:#3d2414;--bad:#ff8a80;--bad-bg:#3f1c1a;--na:#8d97a5;--na-bg:#252c36;
--hl:#4a3f10;--hl-ink:#f3dc79;--int:#6aa3db;--ext:#b994e6;--none:#6c7685;--shadow:0 20px 60px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151b;--card:#1a2029;--ink:#e6eaf0;--muted:#9aa5b4;--line:#2b333f;--accent:#8fbbe6;--accent2:#6aa3db;--soft:#1e2b3b;--brand:#14304d;--brand2:#0d2238;--onbrand:#eef4fa;
--ok:#5fd29a;--ok-bg:#163527;--warn:#e8c94f;--warn-bg:#3a3214;--soon:#f5a36a;--soon-bg:#3d2414;--bad:#ff8a80;--bad-bg:#3f1c1a;--na:#8d97a5;--na-bg:#252c36;
--hl:#4a3f10;--hl-ink:#f3dc79;--int:#6aa3db;--ext:#b994e6;--none:#6c7685;--shadow:0 20px 60px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--brand);color:var(--onbrand);padding-block:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;font-weight:650;text-wrap:balance}
header p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.hlogo{height:40px;background:#fff;border-radius:8px;padding:4px 8px}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.who span{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:999px}
nav.views{background:var(--brand2);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.views a{padding:10px 16px;color:#c9d8e8;text-decoration:none;font-weight:600;font-size:13.5px;border-radius:8px 8px 0 0;white-space:nowrap;margin-top:6px}
nav.views a.on{background:var(--bg);color:var(--accent)}
nav.views a:focus-visible,.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
main{max-width:1320px;margin:0 auto;padding-block:18px 40px}
h2.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 0 8px;font-weight:650}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.hero{background:linear-gradient(135deg,var(--brand),#2f6fa8);color:#fff;border-radius:16px;padding:22px 24px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
.hero-t{flex:1 1 260px;min-width:0}.hero h2{margin:4px 0 6px;font-size:24px;text-wrap:balance}.hero p{margin:0;opacity:.88;font-size:13px}
.eyebrow{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;opacity:.85}
.hero-n{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;flex:2 1 560px;min-width:0}
.hero-n button{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;text-align:left;color:#fff;font:inherit;cursor:pointer}
.hero-n button:hover{background:rgba(255,255,255,.22)}
.hero-n b{display:block;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.15}.hero-n span{font-size:12px;opacity:.92}
.hero-n small{display:block;font-size:11.5px;opacity:.85;margin-top:3px}
@media (max-width:760px){.hero-n{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.box h3{margin:0 0 4px;font-size:14.5px}
.box .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stack{display:flex;height:24px;border-radius:8px;overflow:hidden;margin:6px 0 10px;background:var(--na-bg)}
.stack i{display:block;height:100%;cursor:pointer;min-width:3px}.stack i:hover{filter:brightness(1.12)}
.rows{display:flex;flex-direction:column;gap:2px}
.rowb{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;border:none;background:none;font:inherit;color:inherit;text-align:left;width:100%}
.rowb:hover{background:var(--soft)}
.rowb b{font-variant-numeric:tabular-nums;min-width:38px;text-align:right}.rowb small{color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:10px;padding:10px 14px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.kpi:hover{border-color:var(--accent2);border-left-color:var(--c,var(--accent2))}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}.kpi span{font-size:12px;color:var(--muted)}
/* toolbar + table */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
.toolbar input[type=search]{flex:1 1 260px;min-width:0}
.count{color:var(--muted);font-size:12.5px;margin-left:auto}
.wrap{overflow:auto;border-radius:12px;border:1px solid var(--line);background:var(--card);max-height:calc(100vh - 230px);min-height:260px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;background:var(--card);z-index:2;font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap}
thead tr.f th{top:33px;padding:4px 6px;z-index:2;box-shadow:0 1px 0 var(--line)}
thead tr.f input,thead tr.f select{width:100%;min-width:70px;font-size:12px;padding:4px 6px;border-radius:6px;background:var(--bg)}
thead th.s{cursor:pointer;user-select:none}thead th.s:hover{color:var(--accent)}
thead th .ar{color:var(--accent2)}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--soft)}
tbody tr.hl td{background:var(--hl)}tbody tr.hl:hover td{filter:brightness(.97)}
td{font-size:13px}
td.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
td.nw{white-space:nowrap}td.num{text-align:right;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--muted);font-size:11.5px}
.ri{display:inline-block;font-size:11px;font-weight:700;color:var(--hl-ink);margin-top:2px}
.b{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-soon{background:var(--soon-bg);color:var(--soon)}.s-bad{background:var(--bad-bg);color:var(--bad)}.s-na{background:var(--na-bg);color:var(--na)}.s-info{background:var(--soft);color:var(--accent)}
.more{display:block;margin:10px auto 0}
.btn{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:650}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--card);font-weight:650}
.btn.sm{font-size:12px;padding:4px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{color:var(--muted);font-style:italic;padding:16px}
.msg{background:var(--soft);color:var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
details.colpick{position:relative}
details.colpick summary{list-style:none}
details.colpick summary::-webkit-details-marker{display:none}
details.colpick .menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;z-index:5;box-shadow:var(--shadow);display:grid;gap:2px;min-width:200px}
.menu label,.chk{display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer;padding:2px 0}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.48);display:flex;justify-content:flex-end;z-index:30}
.panel{width:min(860px,100%);height:100%;overflow-y:auto;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.phead{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.phead h2{margin:0;font-size:19px;text-wrap:balance}.phead .sub{color:var(--muted);font-size:13px;margin-top:3px}
.x{margin-left:auto;font:inherit;font-size:20px;line-height:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none}
.pbody{padding:14px 18px 30px;display:flex;flex-direction:column;gap:12px}
.pbody .box h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px}
.f{min-width:0}.f span{display:block;font-size:11.5px;color:var(--muted)}.f b{font-weight:560;overflow-wrap:anywhere}
.f input,.f select,.f textarea{width:100%;font-size:13px;padding:6px 8px}
.toprow{display:grid;grid-template-columns:200px 1fr;gap:12px}
@media (max-width:620px){.toprow{grid-template-columns:1fr}}
.photo{border:2px dashed var(--line);border-radius:12px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:10px;background:var(--card);max-width:100%}
.photo svg{width:44px;height:44px;opacity:.6;margin-bottom:6px}
.cust{display:flex;flex-direction:column;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-weight:650;font-size:13px;border:none;background:none;padding:8px 14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--card)}
.seg button:disabled{cursor:not-allowed}
.relrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.relrow:first-child{border-top:none}
.rt{font-size:11px;font-weight:750;padding:3px 8px;border-radius:6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
.rt-full{background:var(--ok-bg);color:var(--ok)}.rt-oneway{background:var(--soft);color:var(--accent)}.rt-superseded{background:var(--warn-bg);color:var(--warn)}.rt-replaced{background:var(--bad-bg);color:var(--bad)}
.relform{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.relform input{flex:1 1 140px;min-width:0}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;font-size:12px;color:var(--muted);margin-top:10px}
.legend div{display:flex;flex-direction:column;gap:3px}
.hist{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding:3px 10px;margin:6px 0;line-height:1.5}
.hist b{color:var(--ink);font-weight:600}
.mini{width:100%;font-size:12.5px}.mini td,.mini th{padding:5px 6px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);border-radius:14px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.mbox h3{margin:0;font-size:17px;text-wrap:balance}
.alert{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.ok{background:var(--ok-bg);color:var(--ok)}.alert.warn{background:var(--warn-bg);color:var(--warn)}
.mact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* builder */
.bgrid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.bgrid{grid-template-columns:1fr}}
.bside{display:flex;flex-direction:column;gap:10px}
.bside .box h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chip small{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.cgroup{font-size:11.5px;color:var(--muted);margin:8px 0 4px;font-weight:650}
.colgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
tr.ex td{opacity:.45}
/* gantt */
.gwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gscroll{max-height:calc(100vh - 260px);overflow:auto}
.ghead,.grow{display:grid;grid-template-columns:minmax(150px,320px) minmax(0,1fr) 74px}
.ghead{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.ghead>div{padding:8px 10px}
.gaxis{position:relative;height:34px;padding:0!important}
.gaxis span{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:9px 6px 0;white-space:nowrap;font-weight:650}
.grow{border-bottom:1px solid var(--line);cursor:pointer;min-height:36px}
.grow:hover{background:var(--soft)}
.glab{padding:6px 10px;font-size:12.5px;min-width:0;overflow:hidden}
.glab b{font-weight:650}.glab small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtrack{position:relative;min-width:0}
.gtrack .grid-l{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.gtrack .today{position:absolute;top:0;bottom:0;border-left:2px solid var(--accent2);z-index:1}
.bar{position:absolute;top:10px;height:16px;border-radius:5px;background:var(--c);opacity:.9}
.bar.out{background:repeating-linear-gradient(45deg,var(--c) 0 6px,transparent 6px 10px);border:1px solid var(--c)}
.due{position:absolute;top:6px;width:4px;height:24px;border-radius:2px;background:var(--c);margin-left:-2px}
.gdays{padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700}
.mstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
@media (max-width:620px){.ghead,.grow{grid-template-columns:120px minmax(0,1fr) 54px}}
footer{max-width:1320px;margin:0 auto;padding-block:0 30px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function makeList(kind, elId, cols, title, lead){

  };
}

async function saveEdits(it){
  const F = it._kind === 'cal' ? CAL_FIELDS : NC_FIELDS;
  const base = (it._kind === 'cal' ? D.cal : D.nc).find(b => b.k === it.k) || {};
  const prev = BYK.get(it.k);
  const patch = {}, ch = [];
  document.querySelectorAll('[data-e]').forEach(inp => { patch[inp.dataset.e] = inp.value.trim(); });
  const apl = [...document.querySelectorAll('[data-apl]:checked')].map(x => x.dataset.apl);

      <select id="gT" aria-label="Tipo de calibración"><option value="">Calibración: todas</option><option>Interna</option><option>Externa</option><option>Sin proveedor</option></select>
      <select id="gC" aria-label="Custodia"><option value="">Custodia: todas</option>${CUST_OPTS.map(o => `<option>${o}</option>`).join('')}</select>
      <label class="chk"><input type="checkbox" id="gV"> Incluir vencidas</label><label class="chk"><input type="checkbox" id="gN"> Incluir no servibles</label><span class="count" id="gCnt"></span></div>
      <div class="mstrip" id="gStrip"></div><div class="gwrap"><div class="gscroll" id="gBody"></div></div>
      <p class="hint" style="margin-top:8px">La barra va desde la última calibración (o desde hoy) hasta el vencimiento; la línea azul es hoy. Barras rayadas = en calibración. Haz clic en una fila para abrir su ficha.</p>`;
    $('#gQ').oninput = e => { G.q = e.target.value; gDraw(); };
    $('#gM').onchange = e => { G.m = +e.target.value; gDraw(); };
    $('#gT').onchange = e => { G.ctype = e.target.value; gDraw(); };
    $('#gC').onchange = e => { G.cust = e.target.value; gDraw(); };
    $('#gV').onchange = e => { G.venc = e.target.checked; gDraw(); };
    $('#gN').onchange = e => { G.ns = e.target.checked; gDraw(); };
    $('#gBody').addEventListener('click', e => { const r = e.target.closest('[data-k]'); if (r) openFicha(r.dataset.k); });
  }
  gDraw();
}
function gDraw(){
  const end = addMonths(TODAY, G.m), span = (end - TODAY) / 86400000, maxD = Math.round(span);
  const toks = G.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = CAL.filter(i => i._days != null && i._days <= maxD && (G.venc || i._days >= 0) && (G.ns || i.st === 'SERV') && (!G.ctype || i._ctype === G.ctype) && (!G.cust || i._cust === G.cust) && toks.every(t => i._txt.includes(t)))
    .sort((a, b) => a._days - b._days || String(a.id).localeCompare(String(b.id), 'es', {numeric:true}));
  const pos = d => Math.max(0, Math.min(100, ((d - TODAY) / 86400000) / span * 100));
  // month ticks
  const ticks = []; let t = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 1);
  while (t <= end){ ticks.push(t); t = new Date(t.getFullYear(), t.getMonth() + 1, 1); }
  if (G.m === 1){ ticks.length = 0; for (let d = 7; d < span; d += 7) ticks.push(new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() + d)); }
  const tLab = d => G.m === 1 ? `${d.getDate()} ${MES[d.getMonth()]}` : `${MES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;
  // month strip
  const months = []; for (let k = 0; k < G.m; k++){ const a = addMonths(TODAY, k), b = addMonths(TODAY, k + 1); months.push({h: k === 0 ? 'Próximos 30 días' : `${fmt(isoOf(a)).slice(0, 5)} – ${fmt(isoOf(b)).slice(0, 5)}`, n: rows.filter(i => { const d = parseD(i.next); return d >= a && d < b; }).length, c: k === 0 ? 'soon' : k < 3 ? 'warn' : 'ok'}); }
  const nv = rows.filter(i => i._days < 0).length;
  $('#gStrip').innerHTML = (G.venc ? `<div class="kpi" style="--c:var(--bad);cursor:default"><b>${nv}</b><span>Vencidas</span></div>` : '') + months.map(m => `<div class="kpi" style="--c:${COLORS[m.c]};cursor:default"><b>${m.n}</b><span>${m.h}</span></div>`).join('');
  $('#gCnt').textContent = `${rows.length} herramientas`;
  const grid = ticks.map(d => `<i class="grid-l" style="left:${pos(d)}%"></i>`).join('') + `<i class="today" style="left:0"></i>`;
  $('#gBody').innerHTML = `<div class="ghead"><div>Herramienta</div><div class="gaxis">${ticks.map(d => `<span style="left:${pos(d)}%">${tLab(d)}</span>`).join('')}<span style="left:0;border-left:2px solid var(--accent2);color:var(--accent2)">Hoy</span></div><div style="text-align:right">Días</div></div>`
    + (rows.map(i => {
      const c = COLORS[dayCls(i._days)], dd = parseD(i.next), ls = parseD(i.last);
      const l = ls && ls > TODAY ? pos(ls) : 0, r = pos(dd);
      return `<div class="grow" data-k="${esc(i.k)}" title="${esc(`${i.id || ''} ${i.pn} · vence ${fmt(i.next)}`)}"><div class="glab"><b class="mono">${esc(i.id || '—')}</b> · <span class="mono">${esc(i.pn)}</span><small>${esc(i.desc || '')} · ${esc(i.loc || '')}</small></div>
        <div class="gtrack">${grid}${i._days >= 0 ? `<i class="bar ${i._cust === 'En calibración' ? 'out' : ''}" style="--c:${c};left:${l}%;width:${Math.max(r - l, .6)}%"></i>` : ''}<i class="due" style="--c:${c};left:${i._days < 0 ? 0.4 : r}%"></i></div>
        <div class="gdays" style="color:${c}">${i._days < 0 ? i._days : i._days}</div></div>`;
    }).join('') || '<div class="empty">No hay calibraciones que venzan en este horizonte con los filtros elegidos.</div>');
}

// ================= boot =================
function setWho(){
  $('#whoRole').textContent = !window.claude ? 'Vista local' : !RT.ready ? 'Conectando…' : !RT.db ? 'Solo lectura · sin base compartida' : RT.canWrite ? 'Edición habilitada' : 'Solo lectura';
  const s = $('#whoSync'); s.hidden = !(RT.err || (RT.db && !RT.loaded)); s.textContent = RT.err || 'Cargando cambios…';
}
$('#foot').innerHTML = `Fuente: ${esc(D.fuente)} (hojas Her Cal, Her No Cal, Mant Prevent, Control Software y Location Control) + cambios registrados en esta app. Días remanentes calculados con la fecha de hoy (${fmt(HOY)}). Las intercambiables iniciales vienen de la columna “Alternative Part” y quedan como Full int.`;
rebuild(); buildRels(); route(); setWho();
(async () => {
  if (!window.claude){ RT.ready = true; setWho(); return; }
  try { RT.user = await window.claude.use('user'); } catch(e){}
  try { RT.db = await window.claude.use('db'); } catch(e){}
  try { RT.dl = await window.claude.use('downloads'); } catch(e){}
  try { RT.uid = RT.user && RT.user.id ? await RT.user.id() : null; } catch(e){}
  let can = null; try { can = RT.user ? await RT.user.can('data.write') : null; } catch(e){}
  RT.canWrite = !!RT.db && can !== false;
  RT.ready = true; setWho();
  if (OPEN.k) renderFicha();
  if (!RT.db) return;
  const timer = setTimeout(() => { RT.err = 'No se pudieron cargar los cambios todavía; reintentando…'; setWho(); }, 10000);
  let gotE = false, gotR = false;
  const done = m => { if (!m.fromCache){ clearTimeout(timer); RT.err = null; } RT.loaded = gotE && gotR; setWho(); };
  RT.db.collection('edits').onSnapshot(s => { EDITS.clear(); s.docs.forEach(d => EDITS.set(d.id, d.data())); gotE = true; done(s.metadata); refreshAll(); resolveNames(s.docs.map(d => d.data().custBy)); },
    e => { clearTimeout(timer); RT.err = 'No se pudieron cargar los cambios (' + (e && e.code || 'error') + ').'; setWho(); });
  RT.db.collection('rel').onSnapshot(s => { RELDB.clear(); s.docs.forEach(d => RELDB.set(d.id, d.data())); gotR = true; done(s.metadata); refreshAll(); },
    e => { clearTimeout(timer); RT.err = 'No se pudieron cargar las intercambiables (' + (e && e.code || 'error') + ').'; setWho(); });
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if ($('#mdl')) $('#modalHost').innerHTML = ''; else if ($('#ov') || $('#pv')) closeFicha(); } });
</script>
